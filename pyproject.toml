[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airbnb-check"
version = "0.2.0"
description = "Defensive, read-only check of a short-term rental's Wi-Fi for hidden cameras"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Juan Gouvea" }]
keywords = ["airbnb", "hidden-camera", "security", "privacy", "network"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
airbnb-check = "airbnb_check.cli:main"

[project.urls]
Homepage = "https://github.com/junowoz/airbnb-check"

[tool.hatch.build.targets.wheel]
packages = ["src/airbnb_check"]
